# dnsmasq config for devd — serve *.localhost (incl. *.dev.localhost) from 127.0.0.1
# Merge these lines into /opt/homebrew/etc/dnsmasq.conf (Apple Silicon)
# or /usr/local/etc/dnsmasq.conf (Intel), then: brew services restart dnsmasq

# Unprivileged port — macOS routes *.localhost here via /etc/resolver/localhost
# (5353 is taken by mDNSResponder/Bonjour — do not use)
port=5754

# Suffix match: covers anything.localhost, including *.dev.localhost
address=/localhost/127.0.0.1

# Only *.localhost queries reach us (per /etc/resolver), but dnsmasq
# needs at least one upstream server or it will not stay up.
no-resolv
server=1.1.1.1
